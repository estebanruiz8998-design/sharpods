[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sharpods"
version = "0.1.0"
description = "A maximum-capacity sports betting model synthesizing the ten best sports betting books ever written"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SharpOds" }]
dependencies = []

[project.scripts]
sharpods = "sharpods.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["sharpods*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
